<!doctype html>
<!-- Rosmarin storefront shell. Hebrew + RTL. The page is almost empty on purpose:
     app.js builds every screen into #appbar / #view / #sheet at runtime. -->
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <!-- lock zoom + cover the notch so it feels like a native app -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>FreshCart</title>
  <!-- PWA bits: manifest + theme color + home-screen icon so it can be "installed" -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#141414" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="FreshCart" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <link rel="icon" href="logo.svg" />
  <!-- Heebo: the Hebrew web font the whole UI uses -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="appbar" class="appbar"></header>   <!-- top bar — filled by App.setBar() -->
  <main id="view" class="view"></main>            <!-- the scrolling content area for every screen -->

  <!-- bottom tab bar: home / categories / search / cart (app.js wires the clicks) -->
  <nav id="tabbar" class="tabbar">
    <button class="tab active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>בית</span>
    </button>
    <button class="tab" data-tab="categories">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>קטגוריות</span>
    </button>
    <button class="tab" data-tab="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>חיפוש</span>
    </button>
    <button class="tab" data-tab="cart">
      <svg viewBox="0 0 24 24"><path d="M4 5h2l2.5 11h9L21 8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      <span>עגלה</span><i id="tabBadge" class="tabbadge"></i>
    </button>
  </nav>

  <!-- the slide-up bottom sheet (product details / order details) + its dim overlay -->
  <div id="sheetOv" class="sheet-ov"></div>
  <section id="sheet" class="sheet"></section>

  <script src="app.js"></script>
  <!-- register the service worker for offline/PWA — but only where it's allowed
       (https or localhost); a plain-http tunnel just skips it -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
